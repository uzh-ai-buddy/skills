name: Validate skills

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - dev
      - stg
      - prd

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate skill repo
        run: python3 scripts/validate-skills.py
